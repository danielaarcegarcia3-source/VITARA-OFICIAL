name: Verificación VITARA
on:
  push:
    branches: [arena/ccf66afb-vitara-oficial, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vitara-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vitara_test
          POSTGRES_PASSWORD: vitara_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitara_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run test:services
      - run: npm run test:security
      - run: npm run test:postgres
        env:
          # Credenciales ficticias del contenedor desechable, no una cuenta real.
          VITARA_TEST_DATABASE_URL: postgresql://vitara_test:vitara_ci_only@127.0.0.1:5432/postgres
      - run: npm run test:assets
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: evidencia-fallos-ui
          path: test-results/
          retention-days: 3
